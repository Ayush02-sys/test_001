{% for p in posts %}<div class="card"><b>{{p.title}}</b> <small>{{p.created|dt}}, {{p.author}}</small><p>{{p.caption}}</p>
{% if p.media %}{% if p.media.lower().endswith(('.mp4','.webm','.mov')) %}<video controls src="{{ url_for('static', filename='uploads/' ~ p.media) }}"></video>{% else %}<img src="{{ url_for('static', filename='uploads/' ~ p.media) }}" alt="">{% endif %}{% endif %}</div>{% else %}<p>No updates yet.</p>{% endfor %}
